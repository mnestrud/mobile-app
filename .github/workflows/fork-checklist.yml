# Fork-only: runs the exact command from upstream's PR template checklist. Not for upstream.
name: Fork PR checklist

on:
  push:
    branches: [ 'test/**' ]
  workflow_dispatch:

jobs:
  checklist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: chmod +x ./gradlew
      - name: PR template checklist command
        run: ./gradlew detektAll testAndroidHostTest :androidApp:testDebug
